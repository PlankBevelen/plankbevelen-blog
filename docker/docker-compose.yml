name: plankbevelen-blog

services:
  web:
    container_name: plankbevelen-blog
    image: plankbevelen-blog:${IMAGE_TAG:-current}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    environment:
      HOST: 127.0.0.1
      PORT: 3000
      NODE_ENV: production
    network_mode: host
    volumes:
      - /var/www/uploads:/var/www/uploads
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
