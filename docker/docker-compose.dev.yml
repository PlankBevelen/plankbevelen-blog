name: plankbevelen-blog-dev

services:
  mongo:
    image: mongo:7
    container_name: plankbevelen-mongo
    ports:
      - "27017:27017"
    volumes:
      - plankbevelen-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: plankbevelen-redis
    ports:
      - "6379:6379"
    volumes:
      - plankbevelen-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  plankbevelen-mongo-data:
  plankbevelen-redis-data:
